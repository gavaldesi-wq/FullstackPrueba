<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultas de ventas | PC-SHOP</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-dark text-white" hidden>
  <div class="container-fluid">
    <div class="row min-vh-100">
      <aside class="col-12 col-md-3 col-lg-2 bg-black p-4">
        <h2 class="h4">PC-SHOP</h2>
        <p>Consultas de ventas</p>

        <nav aria-label="Menú de ventas">
          <ul class="nav flex-column gap-2">
            <li>
              <a href="#productos" class="nav-link text-info">Productos</a>
            </li>
            <li>
              <a href="#ordenes" class="nav-link text-info">Órdenes</a>
            </li>
          </ul>
        </nav>

        <button id="salir-ventas" type="button"
          class="btn btn-outline-light mt-4">
          Cerrar sesión
        </button>
      </aside>

      <main class="col-12 col-md-9 col-lg-10 p-4">
        <h1 class="h2">Consulta de productos y órdenes</h1>
        <p id="saludo-ventas"></p>

        <section id="productos" class="mt-4">
          <h2 class="h4">Productos</h2>
          <p>Abre cada producto para consultar sus características.</p>
          <div id="lista-productos-ventas"></div>
        </section>

        <section id="ordenes" class="mt-5">
          <h2 class="h4">Órdenes</h2>
          <p id="estado-ordenes" role="status"></p>
          <div id="lista-ordenes-ventas"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/cuentas.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/vendedor.js"></script>
</body>
</html>
