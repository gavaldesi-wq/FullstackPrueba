<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar usuarios | PC-SHOP</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">
  <div class="container-fluid">
    <div class="row min-vh-100">

      <aside class="col-12 col-md-3 col-lg-2 bg-black p-4">
        <h2 class="h4">PC-SHOP</h2>
        <p class="text-secondary">Administración</p>

        <nav aria-label="Menú administrativo">
          <ul class="nav flex-column gap-2">
            <li class="nav-item">
              <a href="admin.html" class="nav-link text-white">
                Productos
              </a>
            </li>
            <li class="nav-item">
              <a
                href="admin-usuarios.html"
                class="nav-link text-info"
                aria-current="page">
                Usuarios
              </a>
            </li>
            <li class="nav-item">
              <a href="index.html" class="nav-link text-white">
                Volver a la tienda
              </a>
            </li>
          </ul>
        </nav>
      </aside>

      <main class="col-12 col-md-9 col-lg-10 p-4">
        <h1 class="h2 mb-4">Administración de usuarios</h1>

        <form id="form-usuario" class="border rounded p-3 mb-4" novalidate>
          <h2 id="titulo-formulario-usuario" class="h5">Nuevo usuario</h2>

          <input type="hidden" id="usuario-id">

          <div class="row g-3">
            <div class="col-md-6">
              <label for="usuario-run" class="form-label">RUN</label>
              <input
                id="usuario-run"
                type="text"
                class="form-control"
                minlength="7"
                maxlength="9"
                placeholder="Sin puntos ni guion"
                required>
            </div>

            <div class="col-md-6">
              <label for="usuario-tipo" class="form-label">Tipo de usuario</label>
              <select id="usuario-tipo" class="form-select" required>
                <option value="">Selecciona un tipo</option>
                <option value="Administrador">Administrador</option>
                <option value="Cliente">Cliente</option>
                <option value="Vendedor">Vendedor</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="usuario-nombre" class="form-label">Nombre</label>
              <input
                id="usuario-nombre"
                type="text"
                class="form-control"
                maxlength="50"
                required>
            </div>

            <div class="col-md-6">
              <label for="usuario-apellidos" class="form-label">Apellidos</label>
              <input
                id="usuario-apellidos"
                type="text"
                class="form-control"
                maxlength="100"
                required>
            </div>

            <div class="col-md-6">
              <label for="usuario-correo" class="form-label">Correo</label>
              <input
                id="usuario-correo"
                type="email"
                class="form-control"
                maxlength="100"
                aria-describedby="ayuda-correo"
                required>
              <p id="ayuda-correo" class="small mt-1 mb-0">
                Dominios permitidos: duoc.cl, profesor.duoc.cl y gmail.com.
              </p>
            </div>

            <div class="col-md-6">
              <label for="usuario-fecha" class="form-label">
                Fecha de nacimiento (opcional)
              </label>
              <input id="usuario-fecha" type="date" class="form-control">
            </div>

            <div class="col-md-6">
              <label for="region" class="form-label">Región</label>
              <select id="region" class="form-select" required>
                <option value="" selected disabled>
                  Selecciona una región
                </option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="comuna" class="form-label">Comuna</label>
              <select id="comuna" class="form-select" required>
                <option value="" selected disabled>
                  Selecciona una comuna
                </option>
              </select>
            </div>

            <div class="col-12">
              <label for="usuario-direccion" class="form-label">Dirección</label>
              <input
                id="usuario-direccion"
                type="text"
                class="form-control"
                maxlength="300"
                required>
            </div>
          </div>

          <p id="mensaje-usuario" class="mt-3" role="status"></p>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-info">
              Guardar usuario
            </button>
            <button
              type="button"
              id="limpiar-usuario"
              class="btn btn-outline-light">
              Limpiar formulario
            </button>
          </div>
        </form>

        <section aria-labelledby="titulo-listado-usuarios">
          <h2 id="titulo-listado-usuarios" class="h4">Usuarios registrados</h2>
          <p id="resumen-usuarios">Todavía no se ha cargado el listado.</p>

          <div class="table-responsive">
            <table class="table table-dark table-striped align-middle">
              <caption class="text-white">Usuarios de PC-SHOP</caption>
              <thead>
                <tr>
                  <th scope="col">RUN</th>
                  <th scope="col">Nombre</th>
                  <th scope="col">Correo</th>
                  <th scope="col">Tipo</th>
                  <th scope="col">Comuna</th>
                  <th scope="col">Acciones</th>
                </tr>
              </thead>
              <tbody id="tabla-usuarios"></tbody>
            </table>
          </div>
        </section>
      </main>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cuentas.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/regiones.js"></script>
  <script src="js/admin-usuarios.js"></script>
</body>
</html>
