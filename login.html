<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | PC-SHOP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark barra-navegacion py-2">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <span class="texto-logo fs-4">PC<span class="destacado">-SHOP</span></span>
        <span class="subtitulo-logo">PC COMPONENTS</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
        aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link enlace-nav" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link enlace-nav" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link enlace-nav" href="nosotros.html">Nosotros</a></li>
          <li class="nav-item"><a class="nav-link enlace-nav" href="blog.html">Blogs</a></li>
          <li class="nav-item"><a class="nav-link enlace-nav" href="contactos.html">Contacto</a></li>
        </ul>

        <div class="d-flex align-items-center me-4 enlaces-usuario">
          <a href="login.html" class="me-3">Iniciar sesión</a>
          <a href="registro.html">Registrar usuario</a>
        </div>

        <a href="carrito.html" class="enlace-carrito d-flex align-items-center"> 
          <span class="position-relative me-1">
            <i class="bi bi-cart3 fs-4"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill contador-carrito">0</span>
          </span>
          
        </a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="tarjeta-formulario">
      <h2>Iniciar Sesión</h2>
      <form id="form-login" novalidate>
        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control campo-formulario" id="correo" name="correo"
            placeholder="tunombre@duoc.cl">
          <div class="mensaje-error d-none" id="error-correo">Ingresa un correo válido.</div>
        </div>

        <div class="mb-3">
          <label for="contrasena" class="form-label">Contraseña</label>
          <input type="password" class="form-control campo-formulario" id="contrasena" name="contrasena"
            placeholder="Entre 4 y 10 caracteres">
          <div class="mensaje-error d-none" id="error-contrasena">La contraseña debe tener entre 4 y 10 caracteres.</div>
        </div>

        <button type="submit" class="btn boton-cyan w-100">Iniciar Sesión</button>

        <span class="enlace-auth">
          ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </span>
      </form>
    </div>
  </div>

  <footer class="py-5 mt-5">
    <div class="container">
      <div class="row">
        <div class="col-12 text-center">
          <p class="mb-0">&copy; 2026 PC-SHOP. Todos los derechos reservados.</p>
        </div>
      </div>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
