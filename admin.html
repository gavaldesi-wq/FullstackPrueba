<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración | PC-SHOP</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-dark text-white" hidden>
  <div class="container-fluid">
    <div class="row min-vh-100">

      <aside class="col-12 col-md-3 col-lg-2 bg-black p-4">
        <h2 class="h4">PC-SHOP</h2>
        <p class="text-secondary">Administración</p>

        <nav aria-label="Menú administrativo">
          <ul class="nav flex-column gap-2">
            <li class="nav-item">
              <a
                href="#productos"
                class="nav-link text-info"
                aria-current="page">
                Productos
              </a>
            </li>
            <li class="nav-item">
  <a href="admin-usuarios.html" class="nav-link text-white">
    Usuarios
  </a>
</li>
            <li class="nav-item">
              <a href="index.html" class="nav-link text-white">
                Volver a la tienda
              </a>
            </li>
          </ul>
        </nav>
      </aside>

      <main class="col-12 col-md-9 col-lg-10 p-4">
        <h1 class="h2 mb-4">Panel de administración</h1>

        <section id="productos" aria-labelledby="titulo-productos">
          <h2 id="titulo-productos" class="h4">Productos</h2>
          <p id="resumen-productos"></p>
          <form id="form-producto" class="border rounded p-3 mb-4" novalidate>
  <h3 id="titulo-formulario" class="h5">Nuevo producto</h3>

  <input type="hidden" id="producto-id">

  <div class="row g-3">
    <div class="col-md-6">
      <label for="producto-codigo" class="form-label">Código</label>
      <input
        id="producto-codigo"
        class="form-control"
        type="text"
        minlength="3"
        required>
    </div>

    <div class="col-md-6">
      <label for="producto-nombre" class="form-label">Nombre</label>
      <input
        id="producto-nombre"
        class="form-control"
        type="text"
        maxlength="100"
        required>
    </div>

    <div class="col-md-6">
      <label for="producto-categoria" class="form-label">Categoría</label>
      <select id="producto-categoria" class="form-select" required>
        <option value="">Selecciona una categoría</option>
        <option>Tarjetas gráficas</option>
        <option>Procesadores</option>
        <option>Memorias RAM</option>
        <option>Almacenamiento</option>
        <option>Placas madre</option>
        <option>Fuentes de poder</option>
        <option>Refrigeración</option>
      </select>
    </div>

    <div class="col-md-6">
      <label for="producto-precio" class="form-label">Precio en pesos</label>
      <input
        id="producto-precio"
        class="form-control"
        type="number"
        min="0"
        step="any"
        required>
    </div>

    <div class="col-md-6">
      <label for="producto-stock" class="form-label">Stock</label>
      <input
        id="producto-stock"
        class="form-control"
        type="number"
        min="0"
        step="1"
        required>
    </div>

    <div class="col-md-6">
      <label for="producto-stock-critico" class="form-label">
        Stock crítico (opcional)
      </label>
      <input
        id="producto-stock-critico"
        class="form-control"
        type="number"
        min="0"
        step="1">
    </div>

    <div class="col-md-6">
      <label for="producto-marca" class="form-label">Marca (opcional)</label>
      <input id="producto-marca" class="form-control" type="text">
    </div>

    <div class="col-md-6">
      <label for="producto-modelo" class="form-label">Modelo (opcional)</label>
      <input id="producto-modelo" class="form-control" type="text">
    </div>

    <div class="col-12">
      <label for="producto-imagen" class="form-label">
        Ruta de imagen (opcional)
      </label>
      <input
        id="producto-imagen"
        class="form-control"
        type="text"
        placeholder="img/ssd.jpg">
    </div>

    <div class="col-12">
      <label for="producto-descripcion" class="form-label">
        Descripción (opcional)
      </label>
      <textarea
        id="producto-descripcion"
        class="form-control"
        rows="3"
        maxlength="500"></textarea>
    </div>

    <div class="col-12">
      <label for="producto-caracteristicas" class="form-label">
        Características (opcional, una por línea)
      </label>
      <textarea
        id="producto-caracteristicas"
        class="form-control"
        rows="3"></textarea>
    </div>
  </div>

  <p id="mensaje-producto" class="mt-3" role="status"></p>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-info">
      Guardar producto
    </button>
    <button type="button" id="cancelar-edicion" class="btn btn-outline-light">
      Limpiar formulario
    </button>
  </div>
</form>

          <div class="table-responsive">
            <table class="table table-dark table-striped align-middle">
              <caption class="text-white">
                Inventario de productos de PC-SHOP
              </caption>
              <thead>
                <tr>
                  <th scope="col">Código</th>
                  <th scope="col">Nombre</th>
                  <th scope="col">Categoría</th>
                  <th scope="col">Precio</th>
                  <th scope="col">Stock</th>
                  <th scope="col">Estado</th>
                  <th scope="col">Acciones</th>
                </tr>
              </thead>
              <tbody id="tabla-productos"></tbody>
            </table>
          </div>
        </section>
      </main>

    </div>
  </div>

  <script src="js/cuentas.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
